[project]
name = "ryzenadj-gui"
version = "0.1.0"
description = "RyzenAdj 的 Windows 图形界面：调功耗/温度限制、实时监控、预设切换"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pyinstaller>=6.10",
]

[project.scripts]
ryzenadj-gui = "ryzenadj_gui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ryzenadj_gui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
